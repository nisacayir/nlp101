<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomelli Görev Akışı</title>
  <style>
    :root {
      --zemin: #f3f5ff;
      --metin: #111827;
      --metin-soluk: #5b6479;
      --cam: rgba(255, 255, 255, 0.42);
      --cam-kenar: rgba(255, 255, 255, 0.72);
      --cam-golge: 0 22px 45px rgba(67, 40, 160, 0.18);
      --ana-1: #ff4fb2;
      --ana-2: #4cc9ff;
      --ana-3: #7df58a;
      --vurgu: #7c3aed;
      --tehlike: #e11d48;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 700px at 10% 0%, #ffd4f0 0%, rgba(255, 212, 240, 0) 60%),
        radial-gradient(950px 700px at 100% 10%, #b3edff 0%, rgba(179, 237, 255, 0) 62%),
        radial-gradient(900px 600px at 40% 100%, #d8ffd9 0%, rgba(216, 255, 217, 0) 58%),
        var(--zemin);
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--metin);
      padding: 20px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      color: inherit;
    }

    .telefon {
      width: 390px;
      height: 844px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.32)),
        linear-gradient(130deg, rgba(255, 79, 178, 0.2), rgba(76, 201, 255, 0.18));
      box-shadow:
        0 30px 55px rgba(37, 21, 96, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }

    .isiltilar {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .isilti {
      position: absolute;
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0.7;
    }

    .isilti.bir {
      width: 150px;
      height: 150px;
      top: -28px;
      right: -24px;
      background: radial-gradient(circle, #ff7ac6 0%, #ff4fb2 60%, transparent 100%);
    }

    .isilti.iki {
      width: 170px;
      height: 170px;
      left: -58px;
      top: 260px;
      background: radial-gradient(circle, #8ee8ff 0%, #4cc9ff 62%, transparent 100%);
    }

    .isilti.uc {
      width: 180px;
      height: 180px;
      right: -80px;
      bottom: 180px;
      background: radial-gradient(circle, #b7ffcb 0%, #7df58a 62%, transparent 100%);
    }

    .ust,
    .duzenleyici,
    .not-karti,
    .gorev-karti,
    .modal-icerik {
      background: var(--cam);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--cam-kenar);
      box-shadow: var(--cam-golge);
    }

    .ust {
      position: relative;
      z-index: 2;
      margin: 12px 12px 8px;
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .baslik h1 {
      margin: 0;
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .baslik p {
      margin: 5px 0 0;
      color: var(--metin-soluk);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .sayaclar {
      margin-top: 11px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .rozet {
      border-radius: 12px;
      padding: 8px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #1f2937;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(255, 255, 255, 0.82);
    }

    .rozet strong {
      font-size: 0.9rem;
      margin-right: 4px;
    }

    .duzenleyici {
      position: relative;
      z-index: 2;
      margin: 0 12px 8px;
      border-radius: var(--radius-lg);
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .arama {
      width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.78);
      background: rgba(255, 255, 255, 0.65);
      padding: 10px 12px;
      font-size: 0.88rem;
      outline: none;
      transition: box-shadow 160ms ease, border-color 160ms ease;
    }

    .arama:focus {
      border-color: rgba(124, 58, 237, 0.42);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
    }

    .filtreler,
    .hizli-islemler {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 1px solid rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.62);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 140ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(124, 58, 237, 0.16);
      background: rgba(255, 255, 255, 0.8);
    }

    .btn.aktif {
      background: linear-gradient(90deg, rgba(255, 79, 178, 0.84), rgba(124, 58, 237, 0.82));
      color: #fff;
      border-color: transparent;
    }

    .btn.tehlike {
      color: #9f1239;
      background: rgba(255, 228, 236, 0.82);
    }

    .btn.mod {
      color: #1d4ed8;
      background: rgba(220, 242, 255, 0.82);
    }

    .surukle-bilgi {
      margin: 0;
      font-size: 0.72rem;
      color: var(--metin-soluk);
      font-weight: 600;
    }

    .icerik {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow: auto;
      padding: 4px 12px 96px;
      display: grid;
      gap: 11px;
    }

    .bolum-baslik {
      margin: 0;
      font-size: 0.78rem;
      color: var(--metin-soluk);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 800;
      padding: 0 2px;
    }

    .gorev-listesi {
      display: grid;
      gap: 10px;
    }

    .gorev-karti {
      border-radius: var(--radius-md);
      padding: 11px;
      position: relative;
      overflow: hidden;
      transition: transform 170ms ease, box-shadow 170ms ease, border-color 170ms ease;
    }

    .gorev-karti::before {
      content: "";
      position: absolute;
      inset: -60% auto auto -40%;
      width: 140%;
      height: 140%;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.32) 40%,
        rgba(255, 255, 255, 0) 72%
      );
      transform: translateX(-58%) rotate(9deg);
      transition: transform 360ms ease;
      pointer-events: none;
    }

    .gorev-karti:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow:
        0 20px 34px rgba(75, 40, 178, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
      border-color: rgba(255, 255, 255, 0.95);
    }

    .gorev-karti:hover::before {
      transform: translateX(30%) rotate(9deg);
    }

    .gorev-karti.tamamlandi {
      opacity: 0.84;
    }

    .gorev-karti.surukleniyor {
      opacity: 0.5;
      transform: scale(0.98);
      box-shadow: 0 8px 20px rgba(30, 41, 59, 0.17);
    }

    .gorev-karti.birak-once::after,
    .gorev-karti.birak-sonra::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ana-1), var(--ana-2), var(--ana-3));
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
      pointer-events: none;
    }

    .gorev-karti.birak-once::after { top: 3px; }
    .gorev-karti.birak-sonra::after { bottom: 3px; }

    .gorev-ust {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .gorev-sol {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
    }

    .durum-cubugu {
      width: 6px;
      min-height: 28px;
      border-radius: 999px;
      margin-top: 2px;
      flex: 0 0 auto;
    }

    .durum-cubugu.yapilacak { background: linear-gradient(180deg, #94a3b8, #64748b); }
    .durum-cubugu.acil { background: linear-gradient(180deg, #fb7185, #e11d48); }
    .durum-cubugu.tamamlandi { background: linear-gradient(180deg, #4ade80, #16a34a); }
    .durum-cubugu.ertelendi { background: linear-gradient(180deg, #facc15, #f59e0b); }

    .gorev-baslik {
      margin: 0;
      font-size: 0.94rem;
      line-height: 1.32;
      font-weight: 800;
      word-break: break-word;
    }

    .gorev-karti.tamamlandi .gorev-baslik {
      text-decoration: line-through;
      color: #6b7280;
    }

    .etiketler {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 0 0 auto;
    }

    .etiket {
      font-size: 0.67rem;
      font-weight: 800;
      border-radius: 999px;
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.62);
    }

    .etiket.durum-yapilacak { color: #334155; }
    .etiket.durum-acil { color: #be123c; }
    .etiket.durum-tamamlandi { color: #166534; }
    .etiket.durum-ertelendi { color: #92400e; }
    .etiket.oncelik-yuksek { color: #1d4ed8; }
    .etiket.oncelik-orta { color: #6d28d9; }
    .etiket.oncelik-dusuk { color: #3f6212; }

    .gorev-detay {
      position: relative;
      z-index: 1;
      margin: 8px 0 0;
      color: var(--metin-soluk);
      font-size: 0.78rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .gorev-alt {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .surukle-ipucu {
      font-size: 0.69rem;
      font-weight: 700;
      color: #475569;
      background: rgba(255, 255, 255, 0.5);
      border: 1px dashed rgba(124, 58, 237, 0.28);
      border-radius: 999px;
      padding: 3px 8px;
    }

    .durum-dugmesi {
      border: 0;
      background: transparent;
      color: #6d28d9;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .gorev-aksiyonlar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .gorev-aksiyonlar button {
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.62);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.66rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    .gorev-aksiyonlar button:hover {
      background: rgba(255, 255, 255, 0.84);
      transform: translateY(-1px);
    }

    .bos-durum {
      border-radius: var(--radius-md);
      border: 1px dashed rgba(124, 58, 237, 0.32);
      padding: 16px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--metin-soluk);
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .not-karti {
      border-radius: var(--radius-lg);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .not-karti h2 {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #475569;
      font-weight: 800;
    }

    .not-karti textarea {
      width: 100%;
      min-height: 78px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.64);
      padding: 10px;
      font-size: 0.82rem;
      outline: none;
    }

    .not-karti textarea:focus {
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
      border-color: rgba(124, 58, 237, 0.34);
    }

    .alt-fab {
      position: absolute;
      right: 15px;
      bottom: 14px;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(130deg, var(--ana-1), var(--vurgu), var(--ana-2));
      color: #fff;
      font-size: 1.9rem;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(99, 40, 222, 0.4);
      z-index: 3;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .alt-fab:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 20px 34px rgba(99, 40, 222, 0.44);
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.34);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal.acik {
      display: flex;
    }

    .modal-icerik {
      width: 100%;
      border-radius: var(--radius-lg);
      padding: 14px;
      display: grid;
      gap: 8px;
    }

    .modal-icerik h3 {
      margin: 0 0 2px;
      font-size: 1rem;
      font-weight: 800;
    }

    .alan {
      display: grid;
      gap: 4px;
    }

    .alan label {
      font-size: 0.74rem;
      font-weight: 700;
      color: #475569;
    }

    .alan input,
    .alan textarea,
    .alan select {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.78);
      padding: 9px 10px;
      font-size: 0.84rem;
      outline: none;
    }

    .alan textarea {
      min-height: 76px;
      resize: vertical;
    }

    .alan input:focus,
    .alan textarea:focus,
    .alan select:focus {
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
      border-color: rgba(124, 58, 237, 0.34);
    }

    .modal-alt {
      margin-top: 2px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-alt button {
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.66);
      padding: 8px 12px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-alt .kaydet {
      background: linear-gradient(100deg, var(--ana-1), var(--vurgu));
      border-color: transparent;
      color: #fff;
    }

    .telefon.tema-neon {
      --ana-1: #ff2ab8;
      --ana-2: #00d9ff;
      --ana-3: #39ff90;
      --vurgu: #5b21b6;
      --cam: rgba(255, 255, 255, 0.36);
    }

    .telefon.tema-lavanta {
      --ana-1: #fd6edc;
      --ana-2: #86a8ff;
      --ana-3: #c2ff9d;
      --vurgu: #7c3aed;
      --cam: rgba(255, 255, 255, 0.46);
    }
  </style>
</head>
<body>
  <main class="telefon tema-pomelli" aria-label="Pomelli görev uygulaması">
    <section class="isiltilar" aria-hidden="true">
      <span class="isilti bir"></span>
      <span class="isilti iki"></span>
      <span class="isilti uc"></span>
    </section>

    <header class="ust">
      <div class="baslik">
        <h1>Pomelli Görev Akışı</h1>
        <p id="ozetSatiri">Günün planını parlak ama düzenli tut.</p>
      </div>
      <div class="sayaclar" id="sayaclar"></div>
    </header>

    <section class="duzenleyici" aria-label="Filtre ve işlemler">
      <input id="aramaKutusu" class="arama" type="search" placeholder="Görev ara..." />
      <div class="filtreler">
        <button class="btn aktif" type="button" data-filtre="tumu">Tümü</button>
        <button class="btn" type="button" data-filtre="yapilacak">Yapılacak</button>
        <button class="btn" type="button" data-filtre="acil">Acil</button>
        <button class="btn" type="button" data-filtre="tamamlandi">Tamamlandı</button>
        <button class="btn" type="button" data-filtre="ertelendi">Ertelendi</button>
      </div>
      <div class="hizli-islemler">
        <button id="tamamlananlariSil" class="btn tehlike" type="button">Tamamlananları sil</button>
        <button id="temaDegistir" class="btn mod" type="button">Renk modu</button>
        <button id="filtreyiSifirla" class="btn" type="button">Filtreyi sıfırla</button>
      </div>
      <p class="surukle-bilgi">Kartı tutup sürükleyerek sıralamayı değiştir.</p>
    </section>

    <section class="icerik">
      <h2 class="bolum-baslik">Görevler</h2>
      <div id="gorevListesi" class="gorev-listesi" aria-live="polite"></div>

      <section class="not-karti">
        <h2>Notlar</h2>
        <textarea id="notAlani" placeholder="Hızlı notunu buraya bırak..."></textarea>
      </section>
    </section>

    <button id="ekleButonu" class="alt-fab" type="button" aria-label="Yeni görev ekle">+</button>

    <section id="modal" class="modal" aria-label="Görev formu">
      <form id="gorevFormu" class="modal-icerik">
        <h3 id="modalBaslik">Yeni görev ekle</h3>

        <div class="alan">
          <label for="gorevBaslik">Başlık</label>
          <input id="gorevBaslik" maxlength="80" required />
        </div>

        <div class="alan">
          <label for="gorevDetay">Detay</label>
          <textarea id="gorevDetay" maxlength="220"></textarea>
        </div>

        <div class="alan">
          <label for="gorevOncelik">Öncelik</label>
          <select id="gorevOncelik">
            <option value="yuksek">Yüksek</option>
            <option value="orta">Orta</option>
            <option value="dusuk">Düşük</option>
          </select>
        </div>

        <div class="alan">
          <label for="gorevDurum">Durum</label>
          <select id="gorevDurum">
            <option value="yapilacak">Yapılacak</option>
            <option value="acil">Acil</option>
            <option value="tamamlandi">Tamamlandı</option>
            <option value="ertelendi">Ertelendi</option>
          </select>
        </div>

        <div class="modal-alt">
          <button id="iptalButonu" type="button">İptal</button>
          <button class="kaydet" type="submit">Kaydet</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const GOREVLER_KEY = "pomelliGorevler.v2";
      const NOT_KEY = "pomelliNotlar.v2";
      const TEMA_KEY = "pomelliTema.v2";
      const GECERLI_FILTRELER = new Set(["tumu", "yapilacak", "acil", "tamamlandi", "ertelendi"]);

        birakSonra: false
      };

      const el = {
        telefon: document.querySelector(".telefon"),
        gorevListesi: document.getElementById("gorevListesi"),
        sayaclar: document.getElementById("sayaclar"),
        ozetSatiri: document.getElementById("ozetSatiri"),
        aramaKutusu: document.getElementById("aramaKutusu"),
        tamamlananlariSil: document.getElementById("tamamlananlariSil"),
        temaDegistir: document.getElementById("temaDegistir"),
        filtreyiSifirla: document.getElementById("filtreyiSifirla"),
        notAlani: document.getElementById("notAlani"),
        ekleButonu: document.getElementById("ekleButonu"),
        modal: document.getElementById("modal"),
        gorevFormu: document.getElementById("gorevFormu"),
        modalBaslik: document.getElementById("modalBaslik"),
        gorevBaslik: document.getElementById("gorevBaslik"),
        gorevDetay: document.getElementById("gorevDetay"),
        gorevOncelik: document.getElementById("gorevOncelik"),
        gorevDurum: document.getElementById("gorevDurum"),
        iptalButonu: document.getElementById("iptalButonu")
      };

      function varsayilanGorevler() {
        return [
          {
            id: idUret(),
            baslik: "Sunum taslağını bitir",
            detay: "Saat 17:00'ye kadar ilk sürüm hazır olmalı.",
            durum: "acil",
            oncelik: "yuksek"
          },
          {
            id: idUret(),
            baslik: "Müşteri e-postalarını cevapla",
            detay: "Bekleyen kritik geri dönüşleri tamamla.",
            durum: "yapilacak",
            oncelik: "orta"
          },
          {
            id: idUret(),
            baslik: "Fatura PDF dosyasını gönder",
            detay: "Muhasebe ile paylaşımı kapat.",
            durum: "tamamlandi",
            oncelik: "orta"
          },
          {
            id: idUret(),
            baslik: "Arşiv klasörünü düzenle",
            detay: "Yoğunluk azalınca sıraya al.",
            durum: "ertelendi",
            oncelik: "dusuk"
          }
        ];
      }

      function idUret() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
      }

      function metinGuvenli(metin) {
        return metin
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function sonrakiTema() {
        const mevcutIndex = TEMALAR.indexOf(state.tema);
        return TEMALAR[(mevcutIndex + 1) % TEMALAR.length];
      }

      function temaUygula() {
        el.telefon.classList.remove("tema-pomelli", "tema-neon", "tema-lavanta");
        el.telefon.classList.add("tema-" + state.tema);
        const sonraki = sonrakiTema();
        el.temaDegistir.textContent = "Renk modu: " + temaEtiketi[state.tema] + " → " + temaEtiketi[sonraki];
      }

      function yukle() {
        try {
          const gorevJson = localStorage.getItem(GOREVLER_KEY);
          state.gorevler = gorevJson ? JSON.parse(gorevJson) : varsayilanGorevler();
          if (!Array.isArray(state.gorevler) || state.gorevler.length === 0) {
            state.gorevler = varsayilanGorevler();
          }
        } catch (_err) {
          state.gorevler = varsayilanGorevler();
        }

        el.notAlani.value = localStorage.getItem(NOT_KEY) || "";
        const tema = localStorage.getItem(TEMA_KEY) || "pomelli";
        state.tema = TEMALAR.includes(tema) ? tema : "pomelli";
        temaUygula();
      }

      function gorevleriKaydet() {
        localStorage.setItem(GOREVLER_KEY, JSON.stringify(state.gorevler));
      }

      function goreviBul(id) {
        return state.gorevler.find((gorev) => gorev.id === id);
      }

      function gorevleriGetir() {
        const filtreli = state.aktifFiltre === "tumu"
          ? state.gorevler.slice()
          : state.gorevler.filter((gorev) => gorev.durum === state.aktifFiltre);

        const arama = state.arama.trim().toLocaleLowerCase("tr");
        if (!arama) return filtreli;

        return filtreli.filter((gorev) => {
          const tamMetin = (gorev.baslik + " " + gorev.detay).toLocaleLowerCase("tr");
          return tamMetin.includes(arama);
        });
      }

      function sayaclariCiz() {
        const toplam = state.gorevler.length;
        const yapilacak = state.gorevler.filter((g) => g.durum === "yapilacak").length;
        const acil = state.gorevler.filter((g) => g.durum === "acil").length;
        const tamamlandi = state.gorevler.filter((g) => g.durum === "tamamlandi").length;

        el.sayaclar.innerHTML = [
          '<span class="rozet"><strong>' + toplam + "</strong>Toplam</span>",
          '<span class="rozet"><strong>' + (yapilacak + acil) + "</strong>Açık</span>",
          '<span class="rozet"><strong>' + acil + "</strong>Acil</span>",
          '<span class="rozet"><strong>' + tamamlandi + "</strong>Tamamlandı</span>"
        ].join("");

        el.ozetSatiri.textContent = "Açık görev: " + (yapilacak + acil) + " • Renkli ama net bir akıştasın.";
      }

      function filtreDugmeleriniCiz() {
        document.querySelectorAll("[data-filtre]").forEach((dugme) => {
          dugme.classList.toggle("aktif", dugme.dataset.filtre === state.aktifFiltre);
        });
      }

      function gorevKartSinifi(gorev) {
        const siniflar = ["gorev-karti"];
        if (gorev.durum === "tamamlandi") siniflar.push("tamamlandi");
        return siniflar.join(" ");
      }

      function gorevKartiniCiz(gorev) {
        const tamamlandiYazi = gorev.durum === "tamamlandi" ? "Yapılacak olarak işaretle" : "Tamamlandı olarak işaretle";
        return (
          '<article class="' + gorevKartSinifi(gorev) + '" data-id="' + gorev.id + '" draggable="true">' +
            '<div class="gorev-ust">' +
              '<div class="gorev-sol">' +
                '<span class="durum-cubugu ' + gorev.durum + '"></span>' +
                '<h3 class="gorev-baslik">' + metinGuvenli(gorev.baslik) + "</h3>" +
              "</div>" +
              '<div class="etiketler">' +
                '<span class="etiket durum-' + gorev.durum + '">' + durumEtiketi[gorev.durum] + "</span>" +
                '<span class="etiket oncelik-' + gorev.oncelik + '">' + oncelikEtiketi[gorev.oncelik] + "</span>" +
              "</div>" +
            "</div>" +
            '<p class="gorev-detay">' + metinGuvenli(gorev.detay || "Detay girilmedi.") + "</p>" +
            '<div class="gorev-alt">' +
              '<span class="surukle-ipucu">↕ sürükle</span>' +
              '<button class="durum-dugmesi" type="button" data-islem="durum-degistir">' + tamamlandiYazi + "</button>" +
              '<div class="gorev-aksiyonlar">' +
                '<button type="button" data-islem="acil-yap">Acil yap</button>' +
                '<button type="button" data-islem="ertele">Ertele</button>' +
                '<button type="button" data-islem="duzenle">Düzenle</button>' +
                '<button type="button" data-islem="sil">Sil</button>' +
              "</div>" +
            "</div>" +
          "</article>"
        );
      }

      function gorevleriCiz() {
        const liste = gorevleriGetir();
        if (liste.length === 0) {
          el.gorevListesi.innerHTML = '<div class="bos-durum">Bu filtrede görev bulunamadı.</div>';
          return;
        }
        el.gorevListesi.innerHTML = liste.map(gorevKartiniCiz).join("");
      }

      function ciz() {
        sayaclariCiz();
        filtreDugmeleriniCiz();
        gorevleriCiz();
      }

      function modalAc(gorev) {
        state.duzenlenenId = gorev ? gorev.id : null;
        el.modalBaslik.textContent = gorev ? "Görevi düzenle" : "Yeni görev ekle";
        el.gorevBaslik.value = gorev ? gorev.baslik : "";
        el.gorevDetay.value = gorev ? gorev.detay : "";
        el.gorevOncelik.value = gorev ? gorev.oncelik : "orta";
        el.gorevDurum.value = gorev ? gorev.durum : "yapilacak";
        el.modal.classList.add("acik");
        el.gorevBaslik.focus();
      }

      function modalKapat() {
        state.duzenlenenId = null;
        el.modal.classList.remove("acik");
        el.gorevFormu.reset();
      }

      function gorevKaydet(event) {
        event.preventDefault();
        const baslik = el.gorevBaslik.value.trim();
        const detay = el.gorevDetay.value.trim();
        const oncelik = el.gorevOncelik.value;
        const durum = el.gorevDurum.value;

        if (!baslik) {
          el.gorevBaslik.focus();
          return;
        }

        if (state.duzenlenenId) {
          const gorev = goreviBul(state.duzenlenenId);
          if (gorev) {
            gorev.baslik = baslik;
            gorev.detay = detay;
            gorev.oncelik = oncelik;
            gorev.durum = durum;
          }
        } else {
          state.gorevler.unshift({
            id: idUret(),
            baslik: baslik,
            detay: detay,
            oncelik: oncelik,
            durum: durum
          });
        }

        gorevleriKaydet();
        modalKapat();
        ciz();
      }

      function gorevSil(id) {
        state.gorevler = state.gorevler.filter((gorev) => gorev.id !== id);
      }

      function kartIslemleriniYonet(event) {
        const dugme = event.target.closest("[data-islem]");
        if (!dugme) return;
        const kart = event.target.closest("[data-id]");
        if (!kart) return;
        const gorev = goreviBul(kart.dataset.id);
        if (!gorev) return;

        const islem = dugme.dataset.islem;
        if (islem === "durum-degistir") {
          gorev.durum = gorev.durum === "tamamlandi" ? "yapilacak" : "tamamlandi";
        } else if (islem === "acil-yap") {
          gorev.durum = "acil";
          gorev.oncelik = "yuksek";
        } else if (islem === "ertele") {
          gorev.durum = "ertelendi";
        } else if (islem === "duzenle") {
          modalAc(gorev);
          return;
        } else if (islem === "sil") {
          gorevSil(gorev.id);
        }

        gorevleriKaydet();
        ciz();
      }

      function tamamlananlariTemizle() {
        state.gorevler = state.gorevler.filter((gorev) => gorev.durum !== "tamamlandi");
        gorevleriKaydet();
        ciz();
      }

      function temaDegistir() {
        state.tema = sonrakiTema();
        temaUygula();
        localStorage.setItem(TEMA_KEY, state.tema);
      }

      function filtreSec(filtre) {
        if (!GECERLI_FILTRELER.has(filtre)) return;
        state.aktifFiltre = filtre;
        ciz();
      }

      function filtreyiSifirla() {
        state.aktifFiltre = "tumu";
        state.arama = "";
        el.aramaKutusu.value = "";
        ciz();
      }

      function birakIsaretleriniTemizle() {
        el.gorevListesi.querySelectorAll(".birak-once, .birak-sonra").forEach((kart) => {
          kart.classList.remove("birak-once", "birak-sonra");
        });
      }

      function gorunenSiraIcineTasima(suruklenenId, hedefId, hedefSonra) {
        const gorunen = gorevleriGetir();
        const gorunenIds = gorunen.map((g) => g.id);
        if (!gorunenIds.includes(suruklenenId)) return;
        if (hedefId && !gorunenIds.includes(hedefId)) return;
        if (suruklenenId === hedefId) return;

        const suruklenenGorev = state.gorevler.find((g) => g.id === suruklenenId);
        if (!suruklenenGorev) return;

        const yeniGorunen = gorunen.filter((g) => g.id !== suruklenenId);
        if (!hedefId) {
          yeniGorunen.push(suruklenenGorev);
        } else {
          const hedefIndex = yeniGorunen.findIndex((g) => g.id === hedefId);
          if (hedefIndex === -1) {
            yeniGorunen.push(suruklenenGorev);
          } else {
            const eklenecekIndex = hedefIndex + (hedefSonra ? 1 : 0);
            yeniGorunen.splice(eklenecekIndex, 0, suruklenenGorev);
          }
        }

        const gorunenSet = new Set(gorunenIds);
        let gorunenPointer = 0;
        state.gorevler = state.gorevler.map((gorev) => {
          if (!gorunenSet.has(gorev.id)) return gorev;
          const yeniGorev = yeniGorunen[gorunenPointer];
          gorunenPointer += 1;
          return yeniGorev;
        });
      }

      function surukleBasladi(event) {
        const kart = event.target.closest(".gorev-karti");
        if (!kart) return;
        state.suruklenenId = kart.dataset.id;
        state.birakHedefId = null;
        state.birakSonra = false;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", state.suruklenenId);
        setTimeout(function () {
          kart.classList.add("surukleniyor");
        }, 0);
      }

      function suruklemeUzerinde(event) {
        if (!state.suruklenenId) return;
        event.preventDefault();
        const kart = event.target.closest(".gorev-karti");
        birakIsaretleriniTemizle();

        if (!kart || kart.dataset.id === state.suruklenenId) {
          state.birakHedefId = null;
          state.birakSonra = true;
          return;
        }

        const dikdortgen = kart.getBoundingClientRect();
        const sonra = event.clientY > dikdortgen.top + dikdortgen.height / 2;
        state.birakHedefId = kart.dataset.id;
        state.birakSonra = sonra;
        kart.classList.add(sonra ? "birak-sonra" : "birak-once");
      }

      function birakildi(event) {
        if (!state.suruklenenId) return;
        event.preventDefault();
        gorunenSiraIcineTasima(state.suruklenenId, state.birakHedefId, state.birakSonra);
        gorevleriKaydet();
        state.suruklenenId = null;
        state.birakHedefId = null;
        state.birakSonra = false;
        birakIsaretleriniTemizle();
        ciz();
      }

      function suruklemeBitti(event) {
        const kart = event.target.closest(".gorev-karti");
        if (kart) {
          kart.classList.remove("surukleniyor");
        }
        state.suruklenenId = null;
        state.birakHedefId = null;
        state.birakSonra = false;
        birakIsaretleriniTemizle();
      }

      function olaylariBagla() {
        document.querySelectorAll("[data-filtre]").forEach((dugme) => {
          dugme.addEventListener("click", function () {
            filtreSec(dugme.dataset.filtre);
          });
        });

        el.aramaKutusu.addEventListener("input", function () {
          state.arama = el.aramaKutusu.value;
          ciz();
        });

        el.gorevListesi.addEventListener("click", kartIslemleriniYonet);
        el.gorevListesi.addEventListener("dragstart", surukleBasladi);
        el.gorevListesi.addEventListener("dragover", suruklemeUzerinde);
        el.gorevListesi.addEventListener("drop", birakildi);
        el.gorevListesi.addEventListener("dragend", suruklemeBitti);

        el.ekleButonu.addEventListener("click", function () {
          modalAc(null);
        });
        el.iptalButonu.addEventListener("click", modalKapat);
        el.modal.addEventListener("click", function (event) {
          if (event.target === el.modal) {
            modalKapat();
          }
        });

        el.gorevFormu.addEventListener("submit", gorevKaydet);
        el.tamamlananlariSil.addEventListener("click", tamamlananlariTemizle);
        el.temaDegistir.addEventListener("click", temaDegistir);
        el.filtreyiSifirla.addEventListener("click", filtreyiSifirla);

        el.notAlani.addEventListener("input", function () {
          localStorage.setItem(NOT_KEY, el.notAlani.value);
        });
      }

      yukle();
      olaylariBagla();
      ciz();
    })();
  </script>
</body>
</html>
