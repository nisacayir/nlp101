<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Görev Takibi - Mobil Uygulama</title>
  <style>
    :root {
      --arka-plan: #f3f5f9;
      --kart: #ffffff;
      --metin: #1a1d26;
      --ikincil-metin: #5a6273;
      --kenar: #d9deea;
      --vurgu: #2563eb;
      --vurgu-soluk: #dbeafe;
      --hata: #dc2626;
      --golge: 0 10px 24px rgba(17, 24, 39, 0.12);
      --yaricap: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #e8edf7 0%, #f7f8fc 100%);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--metin);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
      color: inherit;
    }

    .telefon {
      width: 390px;
      height: 844px;
      background: var(--arka-plan);
      border: 1px solid #cfd6e6;
      border-radius: 18px;
      box-shadow: var(--golge);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .ust {
      padding: 16px 16px 12px;
      background: #fff;
      border-bottom: 1px solid var(--kenar);
    }

    .baslik-satiri {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .baslik h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .baslik p {
      margin: 4px 0 0;
      color: var(--ikincil-metin);
      font-size: 0.78rem;
    }

    .sayaclar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .rozet {
      background: var(--vurgu-soluk);
      color: var(--vurgu);
      border: 1px solid #bfdbfe;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .duzenleyici {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--kenar);
      display: grid;
      gap: 10px;
    }

    .arama {
      width: 100%;
      border: 1px solid var(--kenar);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      font-size: 0.9rem;
      background: #fafbff;
    }

    .arama:focus {
      border-color: #93c5fd;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    .filtreler,
    .hizli-islemler {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      border: 1px solid var(--kenar);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background: #f8faff;
    }

    .btn.aktif {
      background: var(--vurgu);
      color: #fff;
      border-color: var(--vurgu);
    }

    .btn.ikonik {
      background: #eef4ff;
      border-color: #c7d7ff;
      color: #163ea3;
    }

    .btn.tehlike {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }

    .icerik {
      flex: 1;
      overflow: auto;
      padding: 14px 16px 90px;
      display: grid;
      gap: 12px;
    }

    .bolum-baslik {
      margin: 0;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--ikincil-metin);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gorev-listesi {
      display: grid;
      gap: 10px;
    }

    .gorev-karti {
      background: var(--kart);
      border: 1px solid var(--kenar);
      border-radius: var(--yaricap);
      padding: 12px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.04);
    }

    .gorev-karti.tamamlandi {
      opacity: 0.85;
    }

    .gorev-karti.ertelendi {
      background: #fbfcff;
    }

    .gorev-ust {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .gorev-baslik {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .gorev-karti.tamamlandi .gorev-baslik {
      text-decoration: line-through;
      color: var(--ikincil-metin);
    }

    .gorev-detay {
      margin: 7px 0 0;
      color: var(--ikincil-metin);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .etiketler {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .etiket {
      font-size: 0.68rem;
      border-radius: 999px;
      padding: 3px 8px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .etiket.durum-yapilacak { background: #f3f4f6; color: #374151; border-color: #e5e7eb; }
    .etiket.durum-acil { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .etiket.durum-tamamlandi { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
    .etiket.durum-ertelendi { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .etiket.oncelik-yuksek { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
    .etiket.oncelik-orta { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
    .etiket.oncelik-dusuk { background: #ecfccb; color: #3f6212; border-color: #d9f99d; }

    .gorev-alt {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .durum-dugmesi {
      border: 0;
      background: transparent;
      color: var(--vurgu);
      padding: 0;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .gorev-aksiyonlar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .gorev-aksiyonlar button {
      border: 1px solid var(--kenar);
      background: #fff;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.68rem;
      cursor: pointer;
    }

    .gorev-aksiyonlar button:hover {
      background: #f4f8ff;
    }

    .bos-durum {
      background: #fff;
      border: 1px dashed #c6cedf;
      border-radius: var(--yaricap);
      padding: 18px;
      color: var(--ikincil-metin);
      font-size: 0.83rem;
      text-align: center;
    }

    .not-karti {
      background: #fff;
      border: 1px solid var(--kenar);
      border-radius: var(--yaricap);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .not-karti h2 {
      margin: 0;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--ikincil-metin);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .not-karti textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      border: 1px solid var(--kenar);
      border-radius: 10px;
      padding: 9px 10px;
      background: #fafbff;
      font-size: 0.82rem;
      outline: none;
    }

    .alt-fab {
      position: absolute;
      right: 16px;
      bottom: 16px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      background: var(--vurgu);
      color: #fff;
      font-size: 1.7rem;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.35);
    }

    .alt-fab:hover {
      filter: brightness(1.05);
    }

    .modal {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }

    .modal.acik {
      display: flex;
    }

    .modal-icerik {
      width: 100%;
      max-width: 350px;
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      border: 1px solid var(--kenar);
      box-shadow: var(--golge);
      display: grid;
      gap: 8px;
    }

    .modal-icerik h3 {
      margin: 0 0 2px;
      font-size: 1rem;
    }

    .alan {
      display: grid;
      gap: 4px;
    }

    .alan label {
      font-size: 0.75rem;
      color: var(--ikincil-metin);
      font-weight: 600;
    }

    .alan input,
    .alan textarea,
    .alan select {
      border: 1px solid var(--kenar);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.86rem;
      outline: none;
      background: #fff;
    }

    .alan textarea {
      min-height: 74px;
      resize: vertical;
    }

    .modal-alt {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .modal-alt button {
      border: 1px solid var(--kenar);
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-alt .kaydet {
      background: var(--vurgu);
      border-color: var(--vurgu);
      color: #fff;
    }

    .tema-yesil {
      --vurgu: #0f766e;
      --vurgu-soluk: #ccfbf1;
    }
  </style>
</head>
<body>
  <main class="telefon" aria-label="Görev yönetimi uygulaması">
    <header class="ust">
      <div class="baslik-satiri">
        <div class="baslik">
          <h1>Bugünün Görevleri</h1>
          <p id="ozetSatiri">Tüm işlerini düzenli bir şekilde yönet.</p>
        </div>
      </div>
      <div class="sayaclar" id="sayaclar"></div>
    </header>

    <section class="duzenleyici" aria-label="Filtre ve hızlı işlemler">
      <input id="aramaKutusu" class="arama" type="search" placeholder="Görev ara..." />
      <div class="filtreler">
        <button class="btn aktif" type="button" data-filtre="tumu">Tümü</button>
        <button class="btn" type="button" data-filtre="yapilacak">Yapılacak</button>
        <button class="btn" type="button" data-filtre="acil">Acil</button>
        <button class="btn" type="button" data-filtre="tamamlandi">Tamamlandı</button>
        <button class="btn" type="button" data-filtre="ertelendi">Ertelendi</button>
      </div>
      <div class="hizli-islemler">
        <button id="tamamlananlariSil" class="btn tehlike" type="button">Tamamlananları sil</button>
        <button id="temaDegistir" class="btn ikonik" type="button">Tema değiştir</button>
        <button id="tumFiltreyiTemizle" class="btn" type="button">Filtreyi sıfırla</button>
      </div>
    </section>

    <section class="icerik">
      <h2 class="bolum-baslik">Görev Listesi</h2>
      <div id="gorevListesi" class="gorev-listesi" aria-live="polite"></div>

      <section class="not-karti">
        <h2>Notlar</h2>
        <textarea id="notAlani" placeholder="Kısa notlarını buraya yaz..."></textarea>
      </section>
    </section>

    <button id="ekleButonu" class="alt-fab" type="button" aria-label="Yeni görev ekle">+</button>

    <section id="modal" class="modal" aria-label="Görev formu">
      <form id="gorevFormu" class="modal-icerik">
        <h3 id="modalBaslik">Yeni görev ekle</h3>

        <div class="alan">
          <label for="gorevBaslik">Başlık</label>
          <input id="gorevBaslik" maxlength="80" required />
        </div>

        <div class="alan">
          <label for="gorevDetay">Detay</label>
          <textarea id="gorevDetay" maxlength="220"></textarea>
        </div>

        <div class="alan">
          <label for="gorevOncelik">Öncelik</label>
          <select id="gorevOncelik">
            <option value="yuksek">Yüksek</option>
            <option value="orta">Orta</option>
            <option value="dusuk">Düşük</option>
          </select>
        </div>

        <div class="alan">
          <label for="gorevDurum">Durum</label>
          <select id="gorevDurum">
            <option value="yapilacak">Yapılacak</option>
            <option value="acil">Acil</option>
            <option value="tamamlandi">Tamamlandı</option>
            <option value="ertelendi">Ertelendi</option>
          </select>
        </div>

        <div class="modal-alt">
          <button id="iptalButonu" type="button">İptal</button>
          <button class="kaydet" type="submit">Kaydet</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function () {
      const GOREVLER_KEY = "duzenliGorevler.v1";
      const NOT_KEY = "duzenliNotlar.v1";
      const TEMA_KEY = "duzenliTema.v1";
      const GECERLI_FILTRELER = new Set(["tumu", "yapilacak", "acil", "tamamlandi", "ertelendi"]);

      const durumEtiketi = {
        yapilacak: "Yapılacak",
        acil: "Acil",
        tamamlandi: "Tamamlandı",
        ertelendi: "Ertelendi"
      };

      const oncelikEtiketi = {
        yuksek: "Yüksek",
        orta: "Orta",
        dusuk: "Düşük"
      };

      const state = {
        gorevler: [],
        aktifFiltre: "tumu",
        arama: "",
        duzenlenenId: null,
        tema: "mavi"
      };

      const el = {
        telefon: document.querySelector(".telefon"),
        gorevListesi: document.getElementById("gorevListesi"),
        sayaclar: document.getElementById("sayaclar"),
        ozetSatiri: document.getElementById("ozetSatiri"),
        aramaKutusu: document.getElementById("aramaKutusu"),
        tamamlananlariSil: document.getElementById("tamamlananlariSil"),
        temaDegistir: document.getElementById("temaDegistir"),
        tumFiltreyiTemizle: document.getElementById("tumFiltreyiTemizle"),
        notAlani: document.getElementById("notAlani"),
        ekleButonu: document.getElementById("ekleButonu"),
        modal: document.getElementById("modal"),
        gorevFormu: document.getElementById("gorevFormu"),
        modalBaslik: document.getElementById("modalBaslik"),
        gorevBaslik: document.getElementById("gorevBaslik"),
        gorevDetay: document.getElementById("gorevDetay"),
        gorevOncelik: document.getElementById("gorevOncelik"),
        gorevDurum: document.getElementById("gorevDurum"),
        iptalButonu: document.getElementById("iptalButonu")
      };

      function varsayilanGorevler() {
        return [
          {
            id: idUret(),
            baslik: "Sunum taslağını bitir",
            detay: "Saat 17:00'ye kadar ilk sürüm hazır olsun.",
            durum: "acil",
            oncelik: "yuksek"
          },
          {
            id: idUret(),
            baslik: "E-postaları kontrol et",
            detay: "Yanıt bekleyen kritik mesajları cevapla.",
            durum: "yapilacak",
            oncelik: "orta"
          },
          {
            id: idUret(),
            baslik: "Fatura gönderimini tamamla",
            detay: "Muhasebe için PDF çıktısını ilet.",
            durum: "tamamlandi",
            oncelik: "orta"
          },
          {
            id: idUret(),
            baslik: "Dosya arşivini düzenle",
            detay: "Zaman kalırsa yapılacak.",
            durum: "ertelendi",
            oncelik: "dusuk"
          }
        ];
      }

      function idUret() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      function metinGuvenli(metin) {
        return metin
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function yukle() {
        try {
          const gorevJson = localStorage.getItem(GOREVLER_KEY);
          state.gorevler = gorevJson ? JSON.parse(gorevJson) : varsayilanGorevler();
          if (!Array.isArray(state.gorevler) || state.gorevler.length === 0) {
            state.gorevler = varsayilanGorevler();
          }
        } catch (_err) {
          state.gorevler = varsayilanGorevler();
        }

        el.notAlani.value = localStorage.getItem(NOT_KEY) || "";
        state.tema = localStorage.getItem(TEMA_KEY) || "mavi";
        el.telefon.classList.toggle("tema-yesil", state.tema === "yesil");
      }

      function kaydetGorevler() {
        localStorage.setItem(GOREVLER_KEY, JSON.stringify(state.gorevler));
      }

      function goreviBul(id) {
        return state.gorevler.find((gorev) => gorev.id === id);
      }

      function gorevleriGetir() {
        const filtreli = state.aktifFiltre === "tumu"
          ? state.gorevler.slice()
          : state.gorevler.filter((gorev) => gorev.durum === state.aktifFiltre);

        const arama = state.arama.trim().toLocaleLowerCase("tr");
        if (!arama) return filtreli;

        return filtreli.filter((gorev) => {
          const metin = (gorev.baslik + " " + gorev.detay).toLocaleLowerCase("tr");
          return metin.includes(arama);
        });
      }

      function sayaclariCiz() {
        const tumu = state.gorevler.length;
        const yapilacak = state.gorevler.filter((g) => g.durum === "yapilacak").length;
        const acil = state.gorevler.filter((g) => g.durum === "acil").length;
        const tamamlandi = state.gorevler.filter((g) => g.durum === "tamamlandi").length;
        const ertelendi = state.gorevler.filter((g) => g.durum === "ertelendi").length;

        el.sayaclar.innerHTML = [
          '<span class="rozet">Toplam: ' + tumu + "</span>",
          '<span class="rozet">Yapılacak: ' + yapilacak + "</span>",
          '<span class="rozet">Acil: ' + acil + "</span>",
          '<span class="rozet">Tamamlandı: ' + tamamlandi + "</span>",
          '<span class="rozet">Ertelendi: ' + ertelendi + "</span>"
        ].join("");

        el.ozetSatiri.textContent = "Açık görev: " + (yapilacak + acil) + " • Bugün odağını koru.";
      }

      function filtreDugmeleriniCiz() {
        document.querySelectorAll("[data-filtre]").forEach((dugme) => {
          dugme.classList.toggle("aktif", dugme.dataset.filtre === state.aktifFiltre);
        });
      }

      function gorevKartSinifi(gorev) {
        const siniflar = ["gorev-karti"];
        if (gorev.durum === "tamamlandi") siniflar.push("tamamlandi");
        if (gorev.durum === "ertelendi") siniflar.push("ertelendi");
        return siniflar.join(" ");
      }

      function gorevKartiniCiz(gorev) {
        return (
          '<article class="' + gorevKartSinifi(gorev) + '" data-id="' + gorev.id + '">' +
            '<div class="gorev-ust">' +
              '<h3 class="gorev-baslik">' + metinGuvenli(gorev.baslik) + "</h3>" +
              '<div class="etiketler">' +
                '<span class="etiket durum-' + gorev.durum + '">' + durumEtiketi[gorev.durum] + "</span>" +
                '<span class="etiket oncelik-' + gorev.oncelik + '">' + oncelikEtiketi[gorev.oncelik] + "</span>" +
              "</div>" +
            "</div>" +
            '<p class="gorev-detay">' + metinGuvenli(gorev.detay || "Detay girilmedi.") + "</p>" +
            '<div class="gorev-alt">' +
              '<button class="durum-dugmesi" type="button" data-islem="durum-degistir">' + (gorev.durum === "tamamlandi" ? "Yapılacak olarak işaretle" : "Tamamlandı olarak işaretle") + "</button>" +
              '<div class="gorev-aksiyonlar">' +
                '<button type="button" data-islem="acil-yap">Acil yap</button>' +
                '<button type="button" data-islem="ertele">Ertele</button>' +
                '<button type="button" data-islem="duzenle">Düzenle</button>' +
                '<button type="button" data-islem="sil">Sil</button>' +
              "</div>" +
            "</div>" +
          "</article>"
        );
      }

      function gorevleriCiz() {
        const liste = gorevleriGetir();
        if (liste.length === 0) {
          el.gorevListesi.innerHTML = '<div class="bos-durum">Bu filtrede görev bulunamadı.</div>';
          return;
        }
        el.gorevListesi.innerHTML = liste.map(gorevKartiniCiz).join("");
      }

      function ciz() {
        sayaclariCiz();
        filtreDugmeleriniCiz();
        gorevleriCiz();
      }

      function modalAc(gorev) {
        state.duzenlenenId = gorev ? gorev.id : null;
        el.modalBaslik.textContent = gorev ? "Görevi düzenle" : "Yeni görev ekle";
        el.gorevBaslik.value = gorev ? gorev.baslik : "";
        el.gorevDetay.value = gorev ? gorev.detay : "";
        el.gorevOncelik.value = gorev ? gorev.oncelik : "orta";
        el.gorevDurum.value = gorev ? gorev.durum : "yapilacak";
        el.modal.classList.add("acik");
        el.gorevBaslik.focus();
      }

      function modalKapat() {
        state.duzenlenenId = null;
        el.modal.classList.remove("acik");
        el.gorevFormu.reset();
      }

      function gorevKaydet(event) {
        event.preventDefault();
        const baslik = el.gorevBaslik.value.trim();
        const detay = el.gorevDetay.value.trim();
        const oncelik = el.gorevOncelik.value;
        const durum = el.gorevDurum.value;

        if (!baslik) {
          el.gorevBaslik.focus();
          return;
        }

        if (state.duzenlenenId) {
          const gorev = goreviBul(state.duzenlenenId);
          if (gorev) {
            gorev.baslik = baslik;
            gorev.detay = detay;
            gorev.oncelik = oncelik;
            gorev.durum = durum;
          }
        } else {
          state.gorevler.unshift({
            id: idUret(),
            baslik: baslik,
            detay: detay,
            oncelik: oncelik,
            durum: durum
          });
        }

        kaydetGorevler();
        modalKapat();
        ciz();
      }

      function gorevSil(id) {
        state.gorevler = state.gorevler.filter((gorev) => gorev.id !== id);
      }

      function kartIslemleriniYonet(event) {
        const dugme = event.target.closest("[data-islem]");
        if (!dugme) return;
        const kart = event.target.closest("[data-id]");
        if (!kart) return;
        const gorev = goreviBul(kart.dataset.id);
        if (!gorev) return;

        const islem = dugme.dataset.islem;
        if (islem === "durum-degistir") {
          gorev.durum = gorev.durum === "tamamlandi" ? "yapilacak" : "tamamlandi";
        } else if (islem === "acil-yap") {
          gorev.durum = "acil";
          gorev.oncelik = "yuksek";
        } else if (islem === "ertele") {
          gorev.durum = "ertelendi";
        } else if (islem === "duzenle") {
          modalAc(gorev);
          return;
        } else if (islem === "sil") {
          gorevSil(gorev.id);
        }

        kaydetGorevler();
        ciz();
      }

      function tamamlananlariTemizle() {
        state.gorevler = state.gorevler.filter((gorev) => gorev.durum !== "tamamlandi");
        kaydetGorevler();
        ciz();
      }

      function temaDegistir() {
        state.tema = state.tema === "mavi" ? "yesil" : "mavi";
        el.telefon.classList.toggle("tema-yesil", state.tema === "yesil");
        localStorage.setItem(TEMA_KEY, state.tema);
      }

      function filtreSec(filtre) {
        if (!GECERLI_FILTRELER.has(filtre)) return;
        state.aktifFiltre = filtre;
        ciz();
      }

      function filtreleriSifirla() {
        state.aktifFiltre = "tumu";
        state.arama = "";
        el.aramaKutusu.value = "";
        ciz();
      }

      function olaylariBagla() {
        document.querySelectorAll("[data-filtre]").forEach((dugme) => {
          dugme.addEventListener("click", function () {
            filtreSec(dugme.dataset.filtre);
          });
        });

        el.aramaKutusu.addEventListener("input", function () {
          state.arama = el.aramaKutusu.value;
          ciz();
        });

        el.gorevListesi.addEventListener("click", kartIslemleriniYonet);
        el.ekleButonu.addEventListener("click", function () {
          modalAc(null);
        });
        el.iptalButonu.addEventListener("click", modalKapat);
        el.modal.addEventListener("click", function (event) {
          if (event.target === el.modal) {
            modalKapat();
          }
        });

        el.gorevFormu.addEventListener("submit", gorevKaydet);
        el.tamamlananlariSil.addEventListener("click", tamamlananlariTemizle);
        el.temaDegistir.addEventListener("click", temaDegistir);
        el.tumFiltreyiTemizle.addEventListener("click", filtreleriSifirla);

        el.notAlani.addEventListener("input", function () {
          localStorage.setItem(NOT_KEY, el.notAlani.value);
        });
      }

      yukle();
      olaylariBagla();
      ciz();
    })();
  </script>
</body>
</html>
